<style>
  .caja-modal .modal-figma-card { border: 0; border-radius: 20px; padding: 1rem; }
  .caja-modal .figma-input {
    background-color: #f2f2f2 !important;
    border: 0 !important;
    border-radius: 50px !important;
    padding: .65rem 1.25rem !important;
    color: #495057;
  }
  .caja-modal .figma-btn-guardar {
    background-color: #0088ff !important;
    color: #fff !important;
    border: 0 !important;
    border-radius: 50px !important;
    padding: .5rem 2.2rem !important;
    font-weight: 600 !important;
  }
  .caja-modal .figma-banner-blue {
    background-color: #0088ff;
    color: #fff;
    border-radius: 12px;
    padding: .75rem 1.25rem;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
</style>

<!-- MODAL: CREAR TICKET DE MOSTRADOR -->
<div class="modal fade caja-modal" id="modalTicket" tabindex="-1" aria-labelledby="modalTicketTitulo" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg">
        <form id="formTicketMostrador" action="{{ url_for('caja.crear_ticket') }}" method="POST" class="modal-content modal-figma-card shadow-lg"{% if puede('productos.usar') %}
          data-url-buscar="{{ url_for('productos.buscar') }}" data-url-cotizar="{{ url_for('productos.cotizar_producto') }}"{% endif %}>
      <input type="hidden" name="token_envio" value="{{ token_envio() }}">
      <div class="modal-header border-0 px-4 pt-4 pb-0 gap-2">
        <h5 class="modal-title fw-bold" id="modalTicketTitulo">Agregar producto(s)</h5>
        <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 ms-auto" onclick="agregarFilaTicket()">+ Agregar otro</button>
        <button type="button" class="btn-close d-md-none ms-1" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body px-4 pt-3 pb-0">
        <div id="errorTicketMostrador" class="alert alert-danger rounded-3 py-2" role="alert" hidden></div>
        <div id="contenedor-items-ticket">
          <div class="item-ticket-row border-bottom pb-3 mb-3">
            <div class="row g-2 mb-2">
              <div class="col-md-5">
                <input type="number" name="cantidad[]" class="form-control figma-input ticket-cant" placeholder="Cantidad" value="1" min="1" required oninput="calcularTotalTicket()">
              </div>
              <div class="col-md-6">
                <input type="number" step="0.01" name="precio_unitario[]" class="form-control figma-input ticket-precio" placeholder="Precio unitario" required oninput="calcularTotalTicket()">
              </div>
              <div class="col-md-1 d-flex align-items-center justify-content-center">
                <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none" onclick="eliminarFilaTicket(this)">✕</button>
              </div>
            </div>
            <div>
                <input type="text" name="descripcion[]" class="form-control figma-input" placeholder="Descripcion" autocomplete="off" required>
            </div>
          </div>
        </div>
        <h5 class="fw-bold mb-3">Agregar pago</h5>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <select name="metodo_pago" class="form-select figma-input" required onchange="calcularTotalTicket()">
              <option value="Efectivo">Efectivo</option>
              <option value="Tarjeta">Tarjeta</option>
              <option value="Transferencia">Transferencia</option>
            </select>
          </div>
          <div class="col-md-6">
            <input type="text" id="ticket-total-display" class="form-control figma-input fw-bold text-dark" placeholder="Cantidad: $0.00" readonly value="$0.00">
          </div>
        </div>
        <div class="small text-primary mb-3 resumen-comision-ticket d-none" id="ticket-resumen-comision"
             data-tasa-comision="{{ TASA_COMISION_TARJETA }}" aria-live="polite">
          Comisión {{ (TASA_COMISION_TARJETA * 100)|round|int }}%: <strong class="comision-display">$0.00</strong>
          · Cobrar en terminal: <strong class="cobro-terminal-display">$0.00</strong>
        </div>
        <div class="figma-banner-blue mb-4">
          <span>{{ fecha_larga }}</span>
          <span>{{ hora_actual }}</span>
        </div>
      </div>
      <div class="modal-footer border-0 px-4 pt-0 pb-4 d-grid gap-2 d-md-flex">
        <button type="submit" class="btn figma-btn-guardar">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirmación posterior al guardado del ticket -->
<div class="modal fade caja-modal" id="modalImprimirTicket" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable" style="max-width: 430px;">
    <div class="modal-content modal-figma-card shadow-lg">
      <div class="modal-header border-0 px-4 pt-3 pb-0 justify-content-end d-md-none">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body px-4 pt-0 pt-md-4 pb-0 text-center">
        <div class="fs-1 text-success mb-2"><i class="bi bi-check-circle-fill"></i></div>
        <h5 class="fw-bold">Ticket guardado</h5>
        <div id="avisoCajonTicket" class="alert alert-warning rounded-3 py-2 text-start" role="alert" hidden></div>
        <p class="text-muted mb-1">Folio <strong id="folioTicketGuardado"></strong></p>
        <p class="mb-4">¿Deseas imprimir el ticket de mostrador?</p>
      </div>
      <div class="modal-footer border-0 px-4 pt-0 pb-4 d-grid gap-2 d-md-flex justify-content-md-center">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Ahora no</button>
        <button type="button" id="btnImprimirTicketGuardado" class="btn figma-btn-guardar rounded-pill px-4">
          <i class="bi bi-printer me-1"></i> Imprimir
        </button>
      </div>
    </div>
  </div>
</div>
<iframe id="marcoImpresionTicket" title="Impresión del ticket" aria-hidden="true"
  style="position:fixed;width:1px;height:1px;right:0;bottom:0;border:0;opacity:0;pointer-events:none;"></iframe>

{% if puede('productos.usar') %}
<script>
  window.cargarBuscadorProductos ??= function (callback) {
    if (window.BuscadorProductos) { callback(); return; }
    let script = document.getElementById('buscador-productos-script');
    if (!script) {
      script = document.createElement('script');
      script.id = 'buscador-productos-script';
      script.src = {{ url_for('static', filename='productos/buscador_productos.js')|tojson }};
      script.addEventListener('load', callback, { once: true });
      document.head.appendChild(script);
    } else {
      script.addEventListener('load', callback, { once: true });
    }
  };
  window.activarBuscadorTicket = function (fila) {
    window.cargarBuscadorProductos(() => {
      const input = fila.querySelector('[name="descripcion[]"]');
      if (!input || input.getAttribute('data-buscador-activo') === '1') return;
      window.BuscadorProductos.activar(input, {
        fila,
        campoCantidad: fila.querySelector('[name="cantidad[]"]'),
        campoPrecio: fila.querySelector('[name="precio_unitario[]"]'),
        obtenerLista: () => null,
        alCotizar: () => calcularTotalTicket(),
      });
    });
  };
</script>
{% endif %}

<script>
  (function () {
    const form = document.getElementById('formTicketMostrador');
    const modalTicketEl = document.getElementById('modalTicket');
    const modalImprimirEl = document.getElementById('modalImprimirTicket');
    const aviso = document.getElementById('errorTicketMostrador');
    const avisoCajon = document.getElementById('avisoCajonTicket');
    const botonImprimir = document.getElementById('btnImprimirTicketGuardado');
    const marcoImpresion = document.getElementById('marcoImpresionTicket');
    let urlImpresionPendiente = '';

    function nuevoTokenEnvio() {
      const datos = new Uint8Array(16);
      crypto.getRandomValues(datos);
      return Array.from(datos, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    form?.addEventListener('submit', async event => {
      event.preventDefault();
      const totalTicket = calcularTotalTicket();
      if (form.querySelector('[name="metodo_pago"]').value === 'Efectivo' && totalTicket > 0) {
        if (!await cobrarEfectivo(totalTicket)) return;
      }
      aviso.hidden = true;
      const guardar = form.querySelector('[type="submit"]');
      guardar.disabled = true;
      try {
        const respuesta = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'X-Requested-With': 'XMLHttpRequest' },
          credentials: 'same-origin',
        });
        const resultado = await respuesta.json();
        if (!respuesta.ok || !resultado.success) {
          throw new Error(resultado.error || 'No se pudo guardar el ticket.');
        }
        urlImpresionPendiente = resultado.print_url;
        document.getElementById('folioTicketGuardado').textContent = resultado.folio;
        if (avisoCajon) {
          avisoCajon.textContent = resultado.aviso || '';
          avisoCajon.hidden = !resultado.aviso;
        }
        const primeraFila = form.querySelector('.item-ticket-row');
        form.querySelectorAll('.item-ticket-row').forEach((fila, indice) => {
          if (indice > 0) fila.remove();
        });
        form.reset();
        if (primeraFila) primeraFila.querySelector('.ticket-cant').value = '1';
        form.querySelector('[name="token_envio"]').value = nuevoTokenEnvio();
        calcularTotalTicket();
        form.dataset.enviando = '';
        bootstrap.Modal.getOrCreateInstance(modalTicketEl).hide();
      } catch (error) {
        aviso.textContent = error.message;
        aviso.hidden = false;
        delete form.dataset.enviando;
      } finally {
        guardar.disabled = false;
      }
    });

    modalTicketEl?.addEventListener('hidden.bs.modal', () => {
      if (urlImpresionPendiente) bootstrap.Modal.getOrCreateInstance(modalImprimirEl).show();
    });

    botonImprimir?.addEventListener('click', () => {
      if (urlImpresionPendiente) {
        const separador = urlImpresionPendiente.includes('?') ? '&' : '?';
        marcoImpresion.src = `${urlImpresionPendiente}${separador}auto=1`;
      }
      bootstrap.Modal.getOrCreateInstance(modalImprimirEl).hide();
      urlImpresionPendiente = '';
    });

    modalImprimirEl?.addEventListener('hidden.bs.modal', () => {
      urlImpresionPendiente = '';
    });
    {% if puede('productos.usar') %}
    form?.querySelectorAll('.item-ticket-row').forEach(window.activarBuscadorTicket);
    {% endif %}
  })();

  function calcularTotalTicket() {
    let total = 0;
    document.querySelectorAll('#modalTicket .item-ticket-row').forEach(fila => {
      const cant = parseFloat(fila.querySelector('.ticket-cant')?.value) || 0;
      const precio = parseFloat(fila.querySelector('.ticket-precio')?.value) || 0;
      total += cant * precio;
    });
    const displayInput = document.getElementById('ticket-total-display');
    if (displayInput) displayInput.value = '$' + total.toFixed(2);
    const totalRedondeado = Math.round((total + Number.EPSILON) * 100) / 100;

    // Solo informativo: la comisión se calcula y guarda en el servidor.
    const resumenComision = document.getElementById('ticket-resumen-comision');
    if (resumenComision) {
      const conTarjeta = document.querySelector('#modalTicket [name="metodo_pago"]')?.value === 'Tarjeta';
      resumenComision.classList.toggle('d-none', !(conTarjeta && totalRedondeado > 0));
      if (conTarjeta && totalRedondeado > 0) {
        const tasa = parseFloat(resumenComision.dataset.tasaComision) || 0;
        const comision = Math.round((totalRedondeado * tasa + Number.EPSILON) * 100) / 100;
        resumenComision.querySelector('.comision-display').textContent = '$' + comision.toFixed(2);
        resumenComision.querySelector('.cobro-terminal-display').textContent = '$' + (totalRedondeado + comision).toFixed(2);
      }
    }
    return totalRedondeado;
  }

  function agregarFilaTicket() {
    const contenedor = document.getElementById('contenedor-items-ticket');
    const nuevaFila = document.createElement('div');
    nuevaFila.className = 'item-ticket-row border-bottom pb-3 mb-3';
    nuevaFila.innerHTML = `
      <div class="row g-2 mb-2">
        <div class="col-md-5">
          <input type="number" name="cantidad[]" class="form-control figma-input ticket-cant" placeholder="Cantidad" value="1" min="1" required oninput="calcularTotalTicket()">
        </div>
        <div class="col-md-6">
          <input type="number" step="0.01" name="precio_unitario[]" class="form-control figma-input ticket-precio" placeholder="Precio unitario" required oninput="calcularTotalTicket()">
        </div>
        <div class="col-md-1 d-flex align-items-center justify-content-center">
          <button type="button" class="btn btn-sm btn-link text-danger text-decoration-none" onclick="eliminarFilaTicket(this)">✕</button>
        </div>
      </div>
      <div><input type="text" name="descripcion[]" class="form-control figma-input" placeholder="Descripcion" autocomplete="off" required></div>
    `;
    contenedor.appendChild(nuevaFila);
    if (window.activarBuscadorTicket) window.activarBuscadorTicket(nuevaFila);
  }

  function eliminarFilaTicket(boton) {
    const filas = document.querySelectorAll('#modalTicket .item-ticket-row');
    if (filas.length > 1) {
      boton.closest('.item-ticket-row').remove();
      calcularTotalTicket();
    }
  }
</script>
